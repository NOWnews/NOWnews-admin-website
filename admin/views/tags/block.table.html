<table id="tags-table" class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>編號</th>
            <th>名稱</th>
            <th>類別</th>
            <th>建立者</th>
            <th>最後更新者</th>
            <th>建立日期</th>
            <th>移除</th>
        </tr>
    </thead>
    <tbody>
        {% for value in tags %}
            <tr>
                <td>{{ value.sn }}</td>
                <td>
                    <a href="#">
                        {{ value.name }}
                    </a>
                </td>
                <td>{{ value.type }}</td>
                <td>{{ value.CreatedBy.name }}</td>
                <td>{{ value.UpdatedBy.name }}</td>
                <td>{{ value.formatCreatedAt }}</td>
                <td>
                    <button item-id="{{value._id}}" class="btn btn-danger delete-tags">移除</button>
                </td>
            </tr>
        {% endfor %}
    </tbody>
    <tfoot>
        <tr>
            <th>編號</th>
            <th>名稱</th>
            <th>類別</th>
            <th>建立者</th>
            <th>最後更新者</th>
            <th>建立日期</th>
            <th>移除</th>
        </tr>
    </tfoot>
</table>
