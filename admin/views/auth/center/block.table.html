<table id="center-table" class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>中心</th>
            <th>部門/組別</th>
            <th>編輯</th>
            <th>移除</th>
        </tr>
    </thead>
    <tbody>
        {%- for center in centerList %}
            {%- for department in center.Departments %}
                <tr>
                    <td>
                        <a href="/auth/center/{{center.id}}">
                            {{ center.name }}
                        </a>
                    </td>
                    <td>
                        {{ department.name }}
                    </td>
                    <td>
                        <a class="btn btn-info"
                            href="/auth/department/{{department.id}}">
                            編輯
                        </a>
                    </td>
                    <td>
                        <input type="hidden" name="id" value="{{department.id}}">
                        <button class="btn btn-danger delete-department">移除</button>
                    </td>
                </tr>
            {%- endfor %}
        {%- endfor %}
    </tbody>
    <tfoot>
        <tr>
            <th>中心</th>
            <th>部門/組別</th>
            <th>編輯</th>
            <th>移除</th>
        </tr>
    </tfoot>
</table>
