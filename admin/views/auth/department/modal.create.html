<div class="modal fade" id="create-departemnt" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title">新增部門/組別</h4>
            </div>
            <form action="/auth/center/create" method="post">
                <div class="modal-body">
                    <input type="hidden" name="centerId" value="{{center.id}}" required/>
                    {% include "./block.form.html" %}
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">送出</button>
                </div>
            </form>
        </div>
    </div>
</div>
