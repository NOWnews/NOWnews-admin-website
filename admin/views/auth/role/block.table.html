<table id="role-table" class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>名稱</th>
            <th>描述</th>
            <th>編輯</th>
            <th>移除</th>
        </tr>
    </thead>
    <tbody>
        {% for role in roleList %}
            <tr>
                <td>{{ role.name }}</td>
                <td>{{ role.desc }}</td>
                <td>
                    <a class="btn btn-info btn-flat" href="/auth/role/{{role._id}}">
                        編輯
                    </a>
                </td>
                <td>
                    <input type="hidden" name="id" value="{{role._id}}">
                    <button class="btn btn-danger btn-flat delete-role">移除</button>
                </td>
            </tr>
        {% endfor %}
    </tbody>
    <tfoot>
        <tr>
            <th>名稱</th>
            <th>描述</th>
            <th>編輯</th>
            <th>移除</th>
        </tr>
    </tfoot>
</table>
