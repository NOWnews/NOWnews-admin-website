{% set action = {
    "get": "讀取",
    "post": "新增",
    "put": "修改",
    "delete": "刪除"
}%}

<div class="form-group">
    <label>角色名稱
        <span class="text-danger">*</span>
    </label>
    <input class="form-control"
        name="name"
        required
        type="text"
        value="{{ role.name }}" />
</div>
<div class="form-group">
    <label>描述</label>
    <input class="form-control"
        name="desc"
        type="text"
        value="{{ role.desc }}" />
</div>
<div class="form-group">
    <label>可被什麼角色審稿（選更高階層的角色）</label>
    <select id='SuperiorRoles' name="SuperiorRoles" class="form-control" multiple="multiple">
        {% for r in roleList %}
            {% if (role.SuperiorRoles) %}
                <option value="{{ r._id }}"
                    {{ "selected" if (role.SuperiorRoles.indexOf(r._id) >= 0) }}>
                    {{ r.name }}
                </option>
            {% else %}
                <option value="{{ r._id }}">{{ r.name }}</option>
            {% endif %}
        {% endfor %}
    </select>
</div>
<div class="form-group">
    <label>選單權限設定
        <span class="text-danger">*</span>
        <span class="text-warning">設定完畢後請相關角色人員重新登入才生效。</span>
    </label>
    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>項目</th>
                <th>子項目</th>
            </tr>
        </thead>
        <tbody>
            {% for menuPolicy in defaultPolicies %}
                <tr>
                    <td width="15%">{{ menuPolicy._id }}</td>
                    <td>
                        {% for policy in menuPolicy.policies %}
                            <label>
                                <input
                                    {{ checkedPolicies[policy._id] }}
                                    type="checkbox"
                                    name="Policies"
                                    value="{{policy._id}}" />
                                {{ policy.desc if policy.desc != '' else action[policy.method]}}
                            </label>
                        {% endfor %}
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<style>
    .select2-container--default .select2-selection--multiple .select2-selection__choice {
        background-color: #cc4c4c;
    }
</style>
<script type="text/javascript">
    $(function() {
        $("#SuperiorRoles").select2({
            placeholder: '請選擇 ...',
            allowClear: true
        });
    });
</script>
