{% set title = "新增角色" %}
{% extends "../../base.html" %}
{% block headTitle %}
    <title>新編採 | {{ title }}</title>
{% endblock %}

{% block container %}
    <section class="content">
        <div class="box">
            <form action="/auth/role/create" class="role-form" method="post">
                <div class="box-body">
                    {% include "./block.form.html" %}
                </div>
                <div class="box-footer text-center">
                    <a href="/auth/role" class="btn btn-default btn-flat">
                        返回
                    </a>
                    <button type="submit" class="btn btn-success btn-flat">
                        送出
                    </button>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
