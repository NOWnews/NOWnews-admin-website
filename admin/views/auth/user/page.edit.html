{% from "../../util/form-user-record.html" import formUserRecord %}
{% set title = "編輯使用者" %}
{% extends "../../base.html" %}
{% block headTitle %}
    <title>大編輯台 | {{ title }}</title>
{% endblock %}

{% block container %}
    <section class="content">
        <div class="box">
            <div class="box-header">
                <div class="row">
                    <div class="col-md-12 text-center">
                        <img class="img-circle" width="200" height="200" src="{{ user.Avatar.url }}" alt="使用者圖片"/>
                    </div>
                </div>
            </div>
            <form action="/auth/user/{{user._id}}" method="post">
                <div class="box-body">
                    <input type="hidden" name="id" value="{{user._id}}">
                    <input type="hidden" name="_method" value="put">

                    {% include "./block.form.html" %}
                    {{ formUserRecord(user) }}
                </div>
                <div class="box-footer text-center">
                    <a href="/auth/user" class="btn btn-flat btn-default">
                        返回
                    </a>
                    <button type="submit" class="btn btn-flat bg-olive">
                        送出
                    </button>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
