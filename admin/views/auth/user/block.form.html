<div class="row">
    <div class="col-md-6">
        <div class="form-group">
            <label>名稱
                <span class="text-danger">*</span>
            </label>
            <input class="form-control"
                name="name"
                required
                type="text"
                value="{{ user.name }}" />
        </div>
        <div class="form-group">
            <label>員工編號
                <span class="text-danger">*</span>
            </label>
            <input class="form-control"
                name="staffId"
                required
                type="text"
                placeholder="NNxxxxx"
                value="{{ user.staffId }}" />
        </div>
        <div class="form-group">
            <label>中心部門
                <span class="text-danger">*</span>
            </label>
            <select class="form-control select2"
                name="centerAndDept"
                required>
              <option value="">Alabama</option>
            </select>
        </div>
        <div class="form-group">
            <label>信箱
                <span class="text-danger">*</span>
            </label>
            <input class="form-control"
                name="email"
                required
                type="email"
                value="{{ user.email }}" />
        </div>
        <div class="form-group">
            <label>電話
            </label>
            <input class="form-control"
                name="phone"
                required
                type="text"
                value="{{ user.phone }}" />
        </div>
        <div class="form-group">
            <label> 個人網站連結
            </label>
            <input class="form-control"
                name="profileLink"
                required
                type="text"
                value="{{ user.profileLink }}" />
        </div>
    </div>

    <div class="col-md-6">
        <div class="form-group">
            <label>暱稱</label>
            <input class="form-control"
                name="nickname"
                required
                type="text"
                value="{{ user.nickname }}" />
        </div>
        <div class="form-group">
            <label>員工狀態
                <span class="text-danger">*</span>
            </label>
            <select class="form-control select2"
                name="status"
                required>
              <option value="">Alabama</option>
            </select>
        </div>
        <div class="form-group">
            <label>角色
                <span class="text-danger">*</span>
            </label>
            <select class="form-control select2"
                name="centerAndDept"
                required>
              <option value="">Alabama</option>
            </select>
        </div>
        <div class="form-group">
            <label>職稱
                <span class="text-danger">*</span>
            </label>
            <input class="form-control"
                name="jobTitle"
                required
                type="text"
                value="{{ user.jobTitle }}" />
        </div>
        <div class="form-group">
            <label> 個人大頭貼
            </label>
            <input class="form-control"
                name="avatar"
                required
                type="text"
                value="{{ user.avatar }}" />
        </div>
    </div>
</div>
