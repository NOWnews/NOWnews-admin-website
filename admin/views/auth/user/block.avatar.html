<div class="row">
    <div class="col-md-12">

        <div class="form-group">
            <label>個人大頭貼</label>
            <label class="btn btn-default btn-flat fa fa-folder-open-o" for="input-image">
                <input type="file" class="sr-only" id="input-image" name="file" accept=".jpg,.jpeg,.png,.gif">
            </label>
            <button class="btn btn-primary btn-flat fa fa-upload"
                type="button" id="upload-file"></button>
            <p>
                <span class="text-warning">註：圖片切割完畢後，請先按【上傳】再點選下方【確認】才算完成。</span>
            </p>
            <img id="my-image"
                style="border: 1px solid; max-height: 360px; max-width: 100%;"
                src="{{ user.Avatar.url }}" />
            <input id="username" type="hidden" value="{{user.name}}"/>
            <input id="userId" type="hidden" value="{{user._id}}"/>
            <input id="avatar" name="Avatar" type="hidden"
                value="{{ user.Avatar }}" />
        </div>
    </div>
</div>
