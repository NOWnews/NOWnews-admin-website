{% extends "../base.html" %}
{% block headTitle %}
    <title>大編輯台 | 新聞順序管理</title>
{% endblock %}

{% block container %}
    <section class="content">
        <div class="box">
            <div class="box-header">
                <div class="row">
                    <div class="col-md-12">
                        <div class="row">
                            {% include "./block.select.html" %}
                        </div>
                        {% include "./block.table.html" %}
                    </div>
                </div>
            </div>
            <div class="box-body dataTables_wrapper">
            </div>
        </div>
    </section>
    <script>
        $(document).ready(function() {
            $('#tags-table').DataTable({
                "paging": false,
                "searching": false,
            });
            $( ".update-priority" ).on('click', function( event ) {
                var weightedScore = $(this).parents('tr').find('[name=weightedScore]').val();
                var newsId = $(this).attr('newsId');
                $.ajax({
                    url: '/priority/' + newsId,
                    type: 'PUT',
                    data: {
                        weightedScore: weightedScore
                    }
                }).done(function(result) {
                    location.reload();
                }).fail(function() {
                    alert('更新失敗！');
                });
                event.preventDefault();
            });
        });
    </script>
{% endblock %}
