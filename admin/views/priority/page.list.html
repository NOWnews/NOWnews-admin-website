{% extends "../base.html" %}
{% block headTitle %}
    <title>大編輯台 | 關鍵字管理</title>
{% endblock %}

{% block container %}
    <section class="content">
        <div class="box">
            <div class="box-header">
                <div class="row">
                    <div class="col-md-12">
                        <!-- Custom Tabs -->
                        <div class="nav-tabs-custom">
                        <ul class="nav nav-tabs">
                          <li class="active"><a href="#tab_1" data-toggle="tab">分類1</a></li>
                          <li><a href="#tab_2" data-toggle="tab">分類2</a></li>
                          <li><a href="#tab_3" data-toggle="tab">分類3</a></li>
                          <li class="pull-right"><a href="#" class="text-muted"><i class="fa fa-gear"></i></a></li>
                        </ul>
                        <div class="tab-content">
                          <div class="tab-pane active" id="tab_1">
                            <div class="row">
                                <div class="form-group col-md-2">
                                    <a class="btn btn-success" href="/tags/create">添加新聞</a>
                                </div>
                            </div>
                            {% include "./block.table.html" %}
                            {% include "../util/pagination.html" %}
                          </div>
                          <!-- /.tab-pane -->
                          <div class="tab-pane" id="tab_2">
                            <p>tab2</p>
                          </div>
                          <!-- /.tab-pane -->
                          <div class="tab-pane" id="tab_3">
                            <p>tab3</p>
                          </div>
                          <!-- /.tab-pane -->
                        </div>
                        <!-- /.tab-content -->
                        </div>
                        <!-- nav-tabs-custom -->
                        </div>
                </div>
                {# include "./block.query-form.html" #}
            </div>
            <div class="box-body dataTables_wrapper">
            </div>
        </div>
    </section>
    <script>
        $(document).ready(function() {
            $('#tags-table').DataTable({
                "paging": false,
                "searching": false,
            });
        });

        $('.delete-tags').on('click', function(){
            var confirmed = confirm('您確定要刪除嗎？');
            if (!confirmed) { return; }
            var id = $(this).attr('item-id');
            $.ajax({
                url: '/tags/' + id,
                type: 'DELETE',
                success: function(result) {
                    console.log(result)
                    location.reload();
                }
            });
        });
    </script>
{% endblock %}
