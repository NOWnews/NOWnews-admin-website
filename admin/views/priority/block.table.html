<table id="tags-table" class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>標題</th>
            <th>PV</th>
            <th>版面值</th>
            <th>更新</th>
        </tr>
    </thead>
    <tbody>
        {% for value in data %}
            <tr>
                <td>{{ value.title }}</td>
                <td>{{ value.totalScore }}</td>
                <td>
                    <input type="text" name="scores" class="input form-control">
                </td>
                <td class="text-center">
                    <button class="btn btn-success update-priority" href="/tags/create">更新</button>
                </td>
            </tr>
        {% endfor %}
    </tbody>
    <tfoot>
        <tr>
            <th>標題</th>
            <th>PV</th>
            <th>版面值</th>
            <th>更新</th>
        </tr>
    </tfoot>
</table>
