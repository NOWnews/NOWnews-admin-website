<!doctype html>
<html>
    <head>

        {% block head %}<title>新編採 | 首頁</title>{% endblock %}

        {% include "./blocks/head-meta.html" %}
        {% include "./blocks/head-include.html" %}

    </head>

    <body class="hold-transition login-page">
        <div class="login-box">
            <div class="login-logo">
                <b>新編採系統</b>
            </div>
            <p class="login-box-msg">年輕、公義、真相</p>
            <div class="login-box-body">
                <form action="/auth/login" method="post">
                    <div class="form-group has-feedback">
                        <input type="email" class="form-control" value="admin@nownews.com" placeholder="Email">
                        <span class="glyphicon glyphicon-envelope form-control-feedback"></span>
                    </div>
                    <div class="form-group has-feedback">
                        <input type="password" class="form-control" value="admin@nownews.com" placeholder="Password">
                        <span class="glyphicon glyphicon-lock form-control-feedback"></span>
                    </div>
                    <div class="row">
                        <div class="col-xs-8">
                            <!--<div class="checkbox">
                                <label>
                                    <input type="checkbox"> 記得我
                                </label>
                            </div>-->
                        </div>
                        <div class="col-xs-4">
                            <button type="submit" class="btn btn-primary btn-block btn-flat">
                                登入
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
