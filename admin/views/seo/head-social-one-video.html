<!--for base meta -->
<title>{{ video.title }} | {{ video.categories[0].name }} | NOWnews今日新聞</title>
<meta name="description" content="{{ video.body.summary if video.summary == '' else video.title }}" />
<meta name="keywords" content="">

<!-- for facebook use2-->
<meta property="og:url" content="{{ video.jsonld.mainEntityOfPage.id }}">
<meta property="og:title" content="{{ video.title }} | NOWnews今日新聞">
<meta property="og:description" content="{{ video.body.summary if video.summary == '' else video.title }}">
<meta property="og:image" content="{{ video.image }}">

<!-- for Google plus use -->
<meta itemprop="url" content="{{ video.jsonld.mainEntityOfPage.id }}">
<meta itemprop="name" content="{{ video.title }} | NOWnews今日新聞">
<meta itemprop="description" content="{{ video.body.summary if video.summary == '' else video.title }}">
<meta itemprop="image" content="{{ video.image }}">
<meta itemprop="keywords" content="">
<meta itemprop="articleSection" content="{{ video.categories[0].name }}">
<meta itemprop="dateCreated" content="{{ video.jsonld.datePublished }}">
<meta itemprop="dateModified" content="{{ video.jsonld.dateModified }}">
<meta itemprop="datePublished" content="{{ video.jsonld.datePublished }}">
<link rel="canonical" href="{{ video.jsonld.mainEntityOfPage.id }}">
