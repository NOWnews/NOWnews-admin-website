{% extends "../base.html" %}
{% block headTitle %}
    <title>大編輯台 | 每日稿單</title>
{% endblock %}

{% block container %}
    <section class="content">
        <div class="box">
            <div class="box-header">
                <div class="row">
                    <div class="form-group col-md-12">
                        <a class="btn btn-success" href="/dailyplan/create">新增稿單</a>
                        <span class="btn btn-warning show-content-btn toggle">顯示內容</span>
                        <span class="btn btn-warning show-content-btn toggle" style="display:none;">隱藏內容</span>
                    </div>
                </div>
                {% include "./block.query-form.html" %}
                {% include "./block.table.html" %}
            </div>
            <div class="box-body dataTables_wrapper">
                {% include "../util/pagination.html" %}
            </div>
        </div>
    </section>
    <script>
        $(document).ready(function() {
            $('#tags-table').DataTable({
                "order":false,
                "paging": false,
                "searching": false,
            });

            $('span.show-content-btn').on('click',function(){
                $('.toggle').toggle();
                //自動調整textarea的高度至文字高度
                autosize(document.querySelectorAll('textarea'));
            });
        });

        $('.delete-tags').on('click', function(){
            var confirmed = confirm('您確定要刪除嗎？');
            if (!confirmed) { return; }
            var id = $(this).attr('item-id');
            $.ajax({
                url: '/tags/' + id,
                type: 'DELETE',
                success: function(result) {
                    location.reload();
                }
            });
        });
    </script>
{% endblock %}
