{% extends "../base.html" %}
{% block headTitle %}
    <title>大編輯台 | 每日稿單</title>
{% endblock %}

{% block container %}
    <section class="content">
        <div class="box">
            <div class="box-header">
                <h1>姓名 {{ dailyPlan.CreatedBy.name}}</h1>
                <h1>發表日期 {{ dailyPlan.formatCreatedAt}}</h1>
                <h1>新聞日期{{ dailyPlan.formatStartedAt }}</h1>
                <h1>標題 {{ dailyPlan.title }}</h1>
                <h1>內容 {{ dailyPlan.content }}</h1>

            </div>

        </div>
    </section>
    <script>
        $(document).ready(function() {
            $('#tags-table').DataTable({
                "order":false,
                "paging": false,
                "searching": false,
            });
        });

        $('.delete-tags').on('click', function(){
            var confirmed = confirm('您確定要刪除嗎？');
            if (!confirmed) { return; }
            var id = $(this).attr('item-id');
            $.ajax({
                url: '/tags/' + id,
                type: 'DELETE',
                success: function(result) {
                    console.log(result)
                    location.reload();
                }
            });
        });
    </script>
{% endblock %}
