{% set title = "新增稿單" %}
{% extends "../base.html" %}

{% block headTitle %}
    <title>大編輯台 | {{ title }}</title>
{% endblock %}

{% block container %}
<section class="content">
    <form action="/dailyplan/{{dailyPlan.id}}" method="post">
        <input type="hidden" name="_method" value="put">
        <div class="box">
            <div class="box-header with-border">
                <h3 class="box-title">新增稿單</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                        <i class="fa fa-minus"></i>
                    </button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-5">
                        <div class="form-group">
                            <label for="title" class="control-label">標題
                                <span class="text-danger">*</span>
                            </label>
                            <input class="form-control" type="text" name="title" value="{{dailyPlan.title}}" required>
                        </div>
                    </div>
                </div>
                <div class="row">
                     <div class="col-sm-3">
                        <div class="form-group">
                            <label for="startedAt" class="control-label">新聞日期</label>
                            <input type="datetime-local" class="form-control" id="startedAt" name="startedAt">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-5">
                        <label for="centerId">中心
                            <span class="text-danger">*</span>
                        </label>
                        <select class="form-control" id="center" name="Center">
                            {% for department in departments %}
                                {% for center in department.Centers %}
                                    {% if center.id == dailyPlan.Center %}
                                        <option value="{{center.id}}" selected>{{center.name}}</option>
                                    {% else %}
                                        <option value="{{center.id}}">{{center.name}}</option>
                                    {% endif %}
                                {% endfor %}
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row">
                     <div class="col-sm-10">
                        <div class="form-group">
                            <label for="content" class="control-label">內文</label>
                            <textarea rows="15" class="form-control" name="content">{{dailyPlan.content}}</textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="edit-footer text-center">
            <button type="submit" class="btn bg-olive btn-flat margin">儲存</button>
            <a href="./" class="btn bg-maroon btn-flat margin">回列表</button>
        </div>
    </form>
</section>

<!-- tagEditor JS -->
<link rel="stylesheet" type="text/css" href="/static/css/jquery-ui.min.css">
<link rel="stylesheet" href="/static/css/jquery.tag-editor.css" />

<script src="/static/js/jquery-ui.min.js"></script>
<script src="/static/js/jquery.caret.min.js"></script>
<script src="/static/js/jquery.tag-editor.min.js"></script>

<script>
    $(document).ready(function() {
        var today = moment("{{dailyPlan.formatStartedAt}}").format('YYYY-MM-DDTHH:mm:00');
        $('#startedAt').val(today);
    });
</script>
{% endblock %}
