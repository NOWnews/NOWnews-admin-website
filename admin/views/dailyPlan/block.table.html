
<table id="daily-plan-table" class="table table-bordered">
    <thead>
        <tr>
            <th>標題</th>
            <th>作者</th>
            <th class="dailyplan-content toggle" style="display:none;" colspan="3">內容</th>
            <th>中心</th>
            <th>新聞日期</th>
            <th class="toggle">建立日期</th>
            <th class="toggle">編輯</th>
            <th class="toggle">移除</th>
        </tr>
    </thead>
    <tbody id="daily-plan-tbody">

        {% for dailyPlan in dailyPlans %}
            <tr>
                <td><a href="./dailyplan/view/{{dailyPlan._id}}">{{ dailyPlan.title }}</a></td>
                <td>{{ dailyPlan.CreatedBy.name }} </td>
                <td class="dailyplan-content toggle" style="display:none;" colspan="3"> <textarea disabled> {{ dailyPlan.content}} </textarea></td>
                <td>{{ dailyPlan.Center.name }} </td>
                <td>{{ dailyPlan.formatStartedAt }}</td>
                <td class="toggle">{{ dailyPlan.formatCreatedAt }}</td>
                <td class="toggle">
                    <a href="./dailyplan/{{dailyPlan._id}}" class="btn btn-info">編輯</a>
                </td>
                <td class="toggle">
                    <button data-id="{{dailyPlan._id}}" class="btn btn-danger delete-daily-plan">移除</button>
                </td>
            </tr>
        {% endfor %}
    </tbody>
    <tfoot>
        <tr>
            <th>標題</th>
            <th>作者</th>
            <th class="toggle" style="display:none;" colspan="3">內容</th>
            <th>中心</th>
            <th>新聞日期</th>
            <th class="toggle">建立日期</th>
            <th class="toggle">編輯</th>
            <th class="toggle">移除</th>
        </tr>
    </tfoot>
</table>
<script>
    var removeDailyPlanUrl = '/dailyplan/';
    $('#daily-plan-tbody').on('click', '.delete-daily-plan', function(){
                var confirmed = confirm('您確定要刪除嗎？');
                if (!confirmed) { return; }

                var id = $(this).data('id');
                $.ajax({
                    url: removeDailyPlanUrl + id,
                    type: 'DELETE',
                    success: function(data) {
                        window.location.reload();
                    },
                    error: function(err){
                        console.error(err);
                    }
                });
            });




</script>
