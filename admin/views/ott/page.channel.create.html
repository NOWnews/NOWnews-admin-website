{% set title = "新增頻道" %}
{% extends "../base.html" %}

{% block headTitle %}
    <title>大編輯台 | {{ title }}</title>
{% endblock %}

{% block container %}
<section class="content">
    <form action="/ott/channels" method="post">
        <div class="box">
            <div class="box-header with-border">
                <h3 class="box-title">頻道設定</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                        <i class="fa fa-minus"></i>
                    </button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-md-12">
                        <div class="row">
                            {% include "./block.select.html" %}
                        </div>
                    </div>
                    <div class="col-sm-5">
                        <div class="form-group">
                            <label for="title" class="control-label">頻道名稱</label>
                            <input type="text" id="channelname" name="title" class="form-control" required>
                        </div>
                    </div>
                    <div class="col-sm-5">
                        <div class="form-group linkBox">
                            <label for="shortTitle" class="control-label categoryLink">頻道連結</label>
                            <input type="text" name="path" class="form-control" placeholder="http://www.nownews.com/test.m3u8" required>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {#<div class="box">
            <div class="box-header with-border">
                <h3 class="box-title">狀態設定</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                        <i class="fa fa-minus"></i>
                    </button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-4">
                        <div class="form-group">
                            <div class="radio">
                                <label>
                                    <input type="radio" name="status" id="status1" value="OPEN" checked>
                                    開啟
                                </label>
                            </div>
                            <div class="radio">
                                <label>
                                    <input type="radio" name="status" id="status2" value="CLOSE">
                                    關閉
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>#}
        <div class="edit-footer text-center">
            <button type="submit" class="btn bg-olive btn-flat margin">儲存</button>
            <button type="button" class="btn bg-maroon btn-flat margin">取消</button>
        </div>
    </form>
</section>

<!-- tagEditor JS -->
<link rel="stylesheet" type="text/css" href="/static/css/jquery-ui.min.css">

<script src="/static/js/jquery-ui.min.js"></script>


{% endblock %}
