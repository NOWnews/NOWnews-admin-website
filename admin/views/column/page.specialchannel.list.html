{% extends "../base.html" %}

{% block headTitle %}
    <title>大編輯台 | 專欄管理</title>
{% endblock %}

{% set title = "專欄列表" %}

{% block container %}
    <section class="content">
        <div class="box">
            <div class="box-header">
                <div class="row">
                    <div class="form-group col-md-2">
                        <a class="btn btn-success" href="/column/specialchannel/create">新增特輯版型</a>
                    </div>
                </div>
                {% include "./block.specialchannel.table.html" %}
            </div>
            {#
            <div class="box-body dataTables_wrapper">
                {% include "../util/pagination.html" %}
            </div>
            #}
        </div>
    </section>
    <script>
        $(document).ready(function() {
            $('#column-specialchannel-table').DataTable({
                "paging": false,
                "searching": false,
            });
        });

        $('.delete-column-specialchannel').on('click', function(){
            var confirmed = confirm('您確定要刪除嗎？');
            if (!confirmed) { return; }
            var id = $(this).attr('item-id');
            $.ajax({
                url: '/column/specialchannel/' + id,
                type: 'DELETE',
                success: function(result) {
                    location.reload();
                }
            });
        });
    </script>
{% endblock %}
