<div class="video-block">
    <form id="fileupload4" action="/indexpage/create" method="POST" >
        <input type="hidden" name="_method" value="put">
        <input type="hidden" name="type" value="VIDEOS">
        <div class="box">
            <div class="box-header with-border">
                <h3 class="box-title">首頁影片設定</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                        <i class="fa fa-minus"></i>
                    </button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-8">
                        <label class="control-label">影片搜尋</label>
                        <div class="container-search">
                              <div class="search">
                                  <input type="text" id="autocomplete-ajax4" class="input form-control input-autocomplete-ajax" placeholder="search" />
                                  <input type="text" id="autocomplete-ajax-x4" class="input-autocomplete-ajax-x" disabled="disabled" />
                                  <span class="load"></span>
                              </div>
                        </div>
                    </div>
                    <div class="col-sm-12">
                        <small>最多20則</small>
                        <div class="usage_simple" style="position:relative;">
                            <div class="example-container ui-helper-clearfix">
                                <select id="multiselect_simple4" name="videos" class="multiselect" multiple="multiple" style="width:100%">
                                    {% for item in indexpage.videos %}
                                        <option item-date="{{ item.formatStartedAt }}" item-pv="{{ item.pageviews }}" value="{{ item._id }}" item-url="{{ item.completeUrl }}" selected>TOP {{ loop.index }} - {{ item.title }}</option>
                                    {% endfor %}
                                    {% for item in prevideo.newsList %}
                                        <option item-date="{{ item.formatStartedAt }}" item-pv="{{ item.pageviews }}" item-url="{{ item.completeUrl }}" value="{{ item._id }}">{{ item.title }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <!-- debug留用參考 -->
                            <!-- <div class="debug_uiControls">
                                <button id="btnToggleOriginal_simple4">Toggle original element</button>
                                <input type="text" id="txtSearch_simple4" size="15" />
                                <button id="btnSearch_simple4">Search</button>
                                <button id="btnSearch_simple4">Search</button>
                                <input type="button" class="btnGet_value" value="Submit" />
                            </div> -->

                            <div id="debug_simple4" class="debug_log"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <div class="edit-footer text-center">
            <button type="submit" class="btn bg-olive btn-flat margin">送出</button>
            <a href="#" class="btn bg-maroon btn-flat margin">取消</a>
        </div>
    </form>
</div>

<style type="text/css"></style>

<script type="text/javascript">
    $(function(){
        $('#autocomplete-ajax4').autocomplete({
            serviceUrl: '/indexpage/news',
            dataType: 'json',
            deferRequestBy: 600,
            paramName: "title",
            params: {status: 'RELEASE',type: 'VIDEO'},
            onSearchStart: function(){ $(this).siblings('.load').addClass('loader'); console.log('onSearchStart4') },
            onSearchComplete: function(){ $(this).siblings('.load').removeClass('loader');console.log('onSearchComplete4')},
            onSearchError: function(){ $(this).siblings('.load').removeClass('loader');console.log('onSearchError4') },
            transformResult: function(response) {
                return {
                    suggestions: $.map(response.newsList, function(item) {
                        var startTime = item.formatStartedAt;
                        var title = item.title;
                        var url = '/news/' + item._id;
                        var pv = item.pageviews;
                        return { title: title, value: startTime + ' - ' + title, data: item._id, url: url, date: startTime, pv: pv};
                    })
                };
            },
            onSelect: function (suggestion) {

                text = suggestion.data;
                if ($("#multiselect_simple4 option[value='"+text+"']").length === 0) {
                    $('#multiselect_simple4').prepend('<option value="'+suggestion.data+'">'+ suggestion.title +'</option>');

                } else {
                    sweetAlert({
                        title: '<small>已經加入過了</small>!',
                        text: '<span>'+ $('#autocomplete-ajax4').val() +'<span>',
                        html: true
                    });
                }
                $('#multiselect_simple4').multiselect('destroy').multiselect(customOption);
                $('#autocomplete-ajax4').val("");

            },
            onHint: function (hint) {
                $('#autocomplete-ajax-x4').val(hint);
            },
            onInvalidateSelection: function() {
                $('.selection-ajax').html('None selected');
            }
        });
        //影音
        $('#fileupload4').on('submit',function(e){
            var limit = 20;
            var selectedCount = $("option:selected", $('#multiselect_simple4')).length;
            if( selectedCount > limit ){
                swal({
                    title: '影片最多'+limit+'則喔',
                    text: '',
                    type: 'warning',
                    timer: 1000
                });
                e.preventDefault();
            }
        });
    })
</script>
