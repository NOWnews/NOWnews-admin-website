{% set title = "新增新聞" %}
{% extends "../base.html" %}

{% block headTitle %}
    <title>新編採 | {{ title }}</title>
{% endblock %}
{% block container %}
<section class="content">
    <form action="/news/create" method="post">
        <div class="box">
            <div class="box-header with-border">
                <h3 class="box-title"></h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                        <i class="fa fa-minus"></i>
                    </button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-4">
                        <div class="form-group">
                            <label class="control-label">新聞的來源</label>
                            <p>NOWnews</p>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="form-group">
                            <label class="control-label">新聞的作者</label>
                            <select name="Author" class="form-control select2">
                                {% for user in userList %}
                                    <option value="{{ user._id }}">{{ user.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="form-group">
                            <label class="control-label">新聞的類別</label>
                            <select name="type" class="form-control select2">
                                {% for key, type in NEWS_TYPES %}
                                    <option value="{{ key }}">{{ type }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-4">
                        <div class="form-group">
                            <label for="MainMenu" class="control-label">新聞主分類</label>
                            <select id="MainMenu" name="MainMenu" multiple="multiple">
                                {% for m in menus %}
                                    <option value="{{ m._id }}">{{ m.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="form-group">
                            <label for="Menus" class="control-label">新聞次分類</label>
                            <select id='Menus' name="Menus" multiple="multiple">
                                {% for menu in menus %}
                                    <optgroup label="{{ menu.name }}">
                                        {% for child in menu.child %}
                                            <option value='{{ child._id }}'>{{ child.name }}</option>
                                        {% endfor %}
                                    </optgroup>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-sm-4">
                        <div class="checkbox">
                            <label>
                                <input name="isAdult" type="checkbox"> 成人新聞
                            </label>
                        </div>
                        <div class="checkbox">
                            <label>
                                <input name="isDeliver" type="checkbox"> 不可外送
                            </label>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-7">
                        <div class="form-group">
                            <label for="title" class="control-label">長標</label>
                            <input type="text" id="title" name="title" class="input form-control" placeholder="限制字數為 26">
                        </div>
                    </div>
                    <div class="col-sm-5">
                        <div class="form-group">
                            <label for="shortTitle" class="control-label">短標</label>
                            <input type="text" id="shortTitle" name="shortTitle" class="input form-control" placeholder="限制字數為 16">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="box">
            <div class="box-header with-border">
                <h3 class="box-title"></h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                        <i class="fa fa-minus"></i>
                    </button>
                </div>
            </div>
            <div class="box-body">
                <div class="form-group">
                    <label>首圖</label>
                    <ul class="mailbox-attachments clearfix">
                        <li>
                            <span class="mailbox-attachment-icon"><i class="fa fa-file-pdf-o"></i></span>
                            <div class="mailbox-attachment-info">
                                <a href="#" class="mailbox-attachment-name"><i class="fa fa-paperclip"></i> Sep2014-report.pdf</a>
                                <span class="mailbox-attachment-size">
                                    1,245 KB
                                </span>
                            </div>
                        </li>
                    </ul>
                    <div class="btn btn-default btn-file">
                        <i class="fa fa-paperclip"></i> 上傳檔案
                        <input type="file" name="MainPhoto">
                    </div>
                    <p class="help-block">Max. 32MB</p>
                </div>
                <div class="form-group">
                    <label>內文</label>
                    <textarea id="editor1" class="form-control" name="content" rows="5" placeholder="Enter ..."></textarea>
                </div>
                <div class="form-group">
                    <label>自由欄位</label>
                    <textarea id="editor2" class="form-control" name="freeContent" rows="5" placeholder="Enter ..."></textarea>
                </div>
                <div class="form-group">
                    <label>追蹤碼</label>
                    <textarea class="form-control" name="traceCode" rows="5" placeholder="Enter ..."></textarea>
                </div>
                <div class="form-group">
                    <label>關鍵字</label>
                    <select name="tags" class="form-control select2" multiple="multiple" data-placeholder="選擇關鍵字" style="width: 100%;">
                        <option>達美航空</option>
                        <option>失身酒</option>
                        <option>林志穎</option>
                        <option>伊藤千晃</option>
                        <option>台塑</option>
                        <option>告白</option>
                        <option>蔡英九</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="box publish-setting">
            <div class="box-header with-border">
                <h3 class="box-title">發稿設定</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                        <i class="fa fa-minus"></i>
                    </button>
                </div>
            </div>
            <div class="box-body">
                <div class="row">
                    <div class="col-sm-4">
                        <div class="form-group text-center">
                            <div class="radio">
                                <label>
                                    <input type="radio" name="status" id="status-draft" value="DRAFT" checked="">
                                    草稿
                                </label>
                            </div>
                            <div class="radio">
                                <label>
                                    <input type="radio" name="status" id="status-review" value="REVIEW">
                                    送審
                                </label>
                            </div>
                            <div class="radio">
                                <label>
                                    <input type="radio" name="status" id="status-release" value="RELEASE">
                                    發布
                                </label>
                            </div>
                            <div class="radio">
                                <label>
                                    <input type="radio" name="status" id="status-close" value="CLOSE">
                                    關閉
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-8">
                        <div class="form-group">
                            <label class="control-label">指定送審人</label>
                            <select name="LastReviewer" class="form-control select2">
                                {% for user in userList %}
                                    <option value="{{ user._id }}">{{ user.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="control-label">預約發稿</label>
                        </div>
                        <div class="form-group">
                            <div class='input-group date'>
                                <input id="reservation-datetimepicker" name="startedAt" type='text' class="form-control input" />
                                <span class="input-group-addon">
                                    <span class="glyphicon glyphicon-calendar"></span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="box memo-box">
            <div class="box-header with-border">
                <h3 class="box-title">撰稿備忘錄</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                        <i class="fa fa-minus"></i>
                    </button>
                </div>
            </div>
            <!--<div class="box-body ">
                <div class="box-comments">
                    <div class="box-comment">
                        <div class="comment-text">
                            <span class="username">
                                Maria Gonzales
                                <span class="text-muted pull-right">8:03 PM Today</span>
                            </span>
                            It is a long established fact that a reader will be distracted
                            by the readable content of a page when looking at its layout.
                        </div>
                    </div>
                    <div class="box-comment">
                        <div class="comment-text">
                            <span class="username">
                                Maria Gonzales
                                <span class="text-muted pull-right">8:03 PM Today</span>
                            </span>
                            It is a long established fact that a reader will be distracted
                            by the readable content of a page when looking at its layout.
                        </div>
                    </div>
                </div>
            </div>-->
            <div class="box-footer">
                <!-- .img-push is used to add margin to elements next to floating images -->
                <div class="img-push">
                    <input type="text" name="memo" class="form-control input-sm input" placeholder="Press enter to post comment">
                </div>
            </div>
        </div>
        {% include "./block.notice.html" %}
    </form>
</section>

<link rel="stylesheet" href="/static/css/select2.min.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-daterangepicker/2.1.24/daterangepicker.min.css" />

{#  script 暫時放這   #}
<!-- Select2 -->
<!--<script src="/static/js/select2/select2.full.min.js"></script>-->
<!-- CK Editor -->
<script src="https://cdn.ckeditor.com/4.5.7/standard/ckeditor.js"></script>

<!-- moment -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-daterangepicker/2.1.24/moment.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-daterangepicker/2.1.24/daterangepicker.min.js"></script>

<!-- multiple-select -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/multiple-select/1.2.0/multiple-select.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/multiple-select/1.2.0/multiple-select.min.js"></script>

<style>
    .memo-box .box-comments{
        background: #fff;
    }
    .ms-drop ul>li.group {
        font-size: 16px;
        text-align: center;
    }
    .ms-drop ul>li.group input{
        display: none;
    }
</style>
<script>
    $(function () {
        // Replace the <textarea id="editor1"> with a CKEditor
        // instance, using default configuration.
        CKEDITOR.replace('editor1');
        CKEDITOR.replace('editor2');

        var data = CKEDITOR.instances.editor1.getData();
        function strip_tags (input, allowed) {
            allowed = (((allowed || '') + '').toLowerCase().match(/<[a-z][a-z0-9]*>/g) || []).join('');
            var tags = /<\/?([a-z][a-z0-9]*)\b[^>]*>/gi;
            return input.replace(tags, function ($0, $1) {
                return allowed.indexOf('<' + $1.toLowerCase() + '>') > -1 ? $0 : ''
            });
        }

        // 讓 input 按 enter 沒有效果
        $('.input').keypress(function(e) {
            var code = e.keyCode ? e.keyCode : e.which;
            if(code == 13) {
                e.preventDefault();
            }
        });
        $( "form" ).submit(function( event ) {
            var content = CKEDITOR.instances.editor1.getData();
            var freeContent = CKEDITOR.instances.editor2.getData();

            $('[name=content]').val(content);
            $('[name=freeContent]').val(freeContent);
            $('[name=MainMenu]').val($("#MainMenu").multipleSelect("getSelects"));
            $('[name=Menus]').val($("#Menus").multipleSelect("getSelects"));
        });

        $('#reservation-datetimepicker').daterangepicker({
            "timePicker24Hour": true,
            "singleDatePicker": true,
            "timePicker": true,
            "startDate": new Date(),
            "locale": {
                format: 'YYYY-MM-DD HH:mm:ss'
            }
        });

        $(".select2").select2();

        // 發稿設定
        var status = null;
        var publishSetting = function (status) {
            switch (status) {
                case 'DRAFT':
                    $('select[name="LastReviewer"]').prop('disabled', true);
                    $('#reservation-datetimepicker').prop('disabled', true);
                    break;
                case 'REVIEW':
                    $('select[name="LastReviewer"]').prop('disabled', false);
                    $('#reservation-datetimepicker').prop('disabled', false);
                    break;
                case 'RELEASE':
                    $('select[name="LastReviewer"]').prop('disabled', true);
                    $('#reservation-datetimepicker').prop('disabled', true);
                    break;
                case 'CLOSE':
                    $('select[name="LastReviewer"]').prop('disabled', true);
                    $('#reservation-datetimepicker').prop('disabled', true);
                    break;
                default:
                    return false;
            }
        };
        publishSetting($('input[name="status"]:checked', '.publish-setting').attr('value'));
        $('input[name="status"]', '.publish-setting').on('click', function(){
            if (status === $(this).attr('value') ) return false;

            status = $(this).attr('value');
            publishSetting(status);
        });

        $('#MainMenu').multipleSelect({
            filter: true,
            single: true,
            width: '100%'
        });
        $('#Menus').multipleSelect({
            filter: true,
            multiple: true,
            width: '100%',
            selectAll: false,
            allSelected: false
        });
    });
</script>
{% endblock %}
