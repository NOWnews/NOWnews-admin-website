<form action="{{ url }}" method="get">
    <div class="form-group col-md-2">
        <input class="form-control" name="title" placeholder="搜尋：標題" type="text" value="{{ query.title }}" />
    </div>
{% if userList %}
    <div class="form-group col-md-2">
        <select class="form-control" id="dept-and-center" name="CreatedBy">
                <option value="">建立者</option>
                {% for user in userList %}
                   <option value="{{ user.id }}"
                            {{ "selected" if user.id == query.CreatedBy }} >
                                {{ user.name }}
                    </option>
                {% endfor %}
            </select>
    </div>
{% endif %}

    <div class="form-group col-sm-2">
         <div class="row">
            <div class="col-md-3">
                <label class="control-label">
                    狀態
                </label>
            </div>
            <div class="col-md-8">
                <select name="status" class="form-control select2">
                    <option disabled selected value>請選擇</option>

                    {% for key, type in NEWS_STATUS %}
                        <option value="{{ key }}"{{ "selected" if key == query.status }} >
                            {{ type }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>


    </div>

    <div class="form-group col-md-2">
        <div class="row">
            <div class="col-md-4">
                <label for="exampleInputName2">起始日期</label>
            </div>
            <div class="col-md-8">
                <input value="{{ query.startedAt }}" class="form-control" name="startedAt" type="date" />
            </div>
        </div>
    </div>

    <div class="form-group col-md-2">
        <div class="row">
            <div class="col-md-4">
                <label for="exampleInputName2">結束日期</label>
            </div>
            <div class="col-md-8">
                <input value="{{ query.endedAt }}" class="form-control" name="endedAt" type="date" />
            </div>
        </div>
    </div>

    <div class="form-group col-md-2">
        <button class="btn btn-default btn-flat" type="submit">查詢</button>
    </div>

</form>
