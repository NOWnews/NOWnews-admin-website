<form action="{{ url }}" method="get">
 <div class="row">
        <div class="form-group col-md-3">
            <input class="form-control"
                name="title"
                placeholder="搜尋：標題"
                type="text"
                value="{{ query.title }}" />
        </div>
        <div class="form-group col-md-2">
            <button class="btn btn-default btn-flat" type="submit">查詢</button>
        </div>
    </div>

</form>
