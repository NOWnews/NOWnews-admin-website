 <div class="box publish-setting">
    <div class="box-header with-border">
        <h3 class="box-title">
            影片設定
            <span class="text-danger">*</span>
        </h3>
        <div class="box-tools pull-right">
            <button type="button" class="btn btn-box-tool" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                <i class="fa fa-minus"></i>
            </button>
        </div>
    </div>
    <div class="box-body">
        <div class="row">
            <div class="col-sm-12">
                <div class="url-form">
                    <label for="MainVideo">影片 URL</label>
                    <div class="input-group ">
                        <input id="MainVideo" name="MainVideo" type="text" value="http://vimeo.com/18150336" class="form-control">
                        <div class="input-group-btn">
                            <a class="btn btn-info">預覽影片</a>
                        </div>
                    </div>
                </div>
                <br>
                <div id="result" class="img-responsive"></div>
                <video
                    id="my-player"
                    class="video-js vjs-default-skin"
                    controls
                    preload="auto"
                    poster=""
                    data-setup='{"techOrder": ["flash","html5"]}'>
                    <source src="http://59.124.93.43/live/nws055.stream/playlist.m3u8?pf=monitor" type="video/mp4"></source>
                </video>
            </div>
        </div>
    </div>
    <script src="http://cdn.embed.ly/jquery.embedly-3.1.1.min.js"></script>
    <script type="text/javascript" src="//cdn.embed.ly/player-0.0.12.min.js"></script>

    <link href="http://vjs.zencdn.net/5.11/video-js.min.css" rel="stylesheet" type="text/css">
    <script src="http://vjs.zencdn.net/5.11/video.min.js"></script>
    <script>
        $(function(){
            // m3u8
            videojs.options.flash.swf = "http://www.flashls.org/videojs/video-js.swf";
            videojs.options.autoplay = true;

            function userSubmit() {
                loadStream(document.getElementById('userInput').value);
            }
            function loadStream(url) {
                var $vid_obj = _V_("example_video_1");
                    $vid_obj.src(url);
                    $vid_obj.on('loadstart',function(){
                        $vid_obj.play();
                    });
            }

            // 一般影片連結
            var player = null;
            var embed = function(url){

                return $.embedly.oembed(url, {query: {scheme: 'http', maxwidth: '600'}})
                .progress(function(obj){

                    if (!obj.html){
                        $('#result').html('');
                        window.alert('影片的連結有問題！');
                        return false;
                    }

                    $('#result').html(obj.html);
                });
            };

            // URL inpute
            var $url = $('#MainVideo');
            $('.url-form a').on('click', function(){
                embed($url.val());
                return false;
            });

        });
        $.embedly.defaults.key = '3ee528c9eb4b4908b268ce1ace120c92';
    </script>
</div>
