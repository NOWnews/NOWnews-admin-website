 <div class="box video-setting-area">
    <div class="box-header with-border">
        <h3 class="box-title">
            影片設定上傳區
            <span class="text-danger">*</span>
        </h3>
        <div class="box-tools pull-right">
            <button type="button" class="btn btn-box-tool video-btn-collapse" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                <i class="fa fa-minus"></i>
            </button>
        </div>
    </div>
    <div class="box-body">
        <div class="row">
            <div class="col-sm-12">
                <label>
                    主影片
                    <span class="text-danger">*</span>
                </label>
                <div>
                </div>
                <input type="hidden" name="MainVideo" value="{{news.MainVideo._id}}" />
                <input type="hidden" name="MainVideoUrl" value="{{news.MainVideo.url}}" />
                <div id="video-preview">
                    <div id="video-preview-player"></div>
                    <div class="preview-toolbar">
                        <a class="btn btn-success fa fa-save"></a>
                        <a class="btn btn-warning fa fa-undo hidden"></a>
                    </div>
                    <div class="input-group" style="margin: 7px 0;">
                        <span class="hide origin-title">{{news.MainVideo.title}}</span>
                        <span class="input-group-addon">標題</span>
                        <input type="text" class="input form-control new-title" value="{{news.MainVideo.title}}" />
                    </div>
                    <div class="input-group">
                        <span class="hide origin-desc">{{news.MainVideo.desc}}</span>
                        <span class="input-group-addon">描述</span>
                        <textarea class="form-control new-desc" rows="4">{{news.MainVideo.desc}}</textarea>
                    </div>
                </div>
                <div class="content">
                    <ul class="nav nav-tabs ui-sortable-handle">
                        <li class="active"><a href="#video-upload" data-toggle="tab">影片上傳</a></li>
                        <li class=""><a href="#video-url" data-toggle="tab">影片網址</a></li>
                        <li class=""><a href="#video-library" data-toggle="tab">自家影片庫</a></li>
                    </ul>
                    <div class="tab-content no-padding">
                        <div class="tab-pane active" id="video-upload">
                            <br>
                            <label class="btn btn-success fileinput-button" for="fileupload-video">
                                <i class="fa fa-plus"></i>
                                <span>上傳影片檔</span>
                                <input id="fileupload-video" type="file" name="files[]" multiple class="sr-only" accept="video/mp4,video/x-m4v,video/*">
                            </label>
                            <div class="row">
                                <div class="col-sm-12"><span class="text-muted">限定檔案類型：mp4</span></div>
                                <div class="col-sm-12"><span class="text-muted">建議將影片先壓縮 若影片超過100MB 請耐心等候 請勿重複上傳影片</span></div>
                            </div>
                            <br>
                            <table role="presentation" class="table table-striped">
                                <tbody id="files-video"></tbody>
                            </table>
                        </div>
                        <div class="tab-pane" id="video-url">
                             <ul  style="margin-top:10px;">
                                <li>
                                    <a href="../static/img/video-upload-example/fb.gif" target="_blank">Facebook影片上傳操作範例</a>
                                </li>
                                <li>
                                    <a href="../static/img/video-upload-example/youtube.gif" target="_blank">YouTube影片上傳操作範例</a>
                                </li>
                            </ul>
                            <div class="url-form">
                                <br>
                                <label>影片 URL</label>
                                <div class="input-group">
                                    <input name="video-url" type="text" placeholder="https://www.youtube.com/watch?v=VRThxEYVJGs" value="https://www.youtube.com/watch?v=VRThxEYVJGs" class="form-control">
                                    <div class="input-group-btn">
                                        <a class="btn btn-info preview">預覽影片</a>
                                    </div>
                                </div>
                            </div>
                            <br>
                            <table role="presentation" class="table table-striped">
                                <tbody id="url-video"></tbody>
                            </table>
                        </div>
                        <div role="tabpanel" class="tab-pane" id="video-library">
                            <br>
                            <div class="row">
                                <div class="form-group col-md-2">
                                    <input name="videoStartedAt" type="date" />
                                </div>
                                <div class="form-group col-md-2">
                                    <input name="videoEndedAt" type="date" />
                                </div>
                                <div class="form-group col-md-2">
                                    <input id="videoKeywords" name="videoKeywords" type="text" placeholder="關鍵字(用逗點區隔)"/>
                                </div>
                                <div class="form-group col-md-1">
                                    <button type="button" class="btn btn-default videoLibQueryForm">查詢</button>
                                </div>
                            </div>
                            <div class="row video-blocks">

                            </div>
                            <div class="text-center">
                                <button class="btn btn-default videoCollapse" type="button">
                                    <i class='fa fa-angle-double-up'></i> 收合
                                </button>

                                <br />
                                <input id="videoPageIndex" name="videoPageIndex" type="hidden"  value='1' />
                                <button class="btn btn-link videoPrev hidden" type="button">上一頁 </button>
                                第 <span class="videoPage">1</span> 頁，共 <span class="totalPage">1</span> 頁
                                <button class="btn btn-link videoNext hidden" type="button"> 下一頁</button>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {# 模板 #}

    {# 上傳回來的結果 #}
    <script id="video-upload-template" type="text/x-custom-template">
        <tr class="template-upload fade">
            <td>
                <div class="preview text-center"></div>
                <div class="form-group">
                    <div class="checkbox">
                        <label><input type="checkbox" name="isDeliver" checked="checked" />可外送</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>影片標題</label>
                    <input name="title" class="form-control" placeholder="影片標題" />
                </div>
                <div class="form-group">
                    <label>影片描述</label>
                    <textarea name="desc" class="form-control" placeholder="影片描述" rows="4"></textarea>
                    <input name="url" type="hidden"></textarea>
                </div>
                <strong class="error text-danger"></strong>
            </td>
            <td class="hidden-xs">
                <p class="size">處理中...</p>
                <div class="progress progress-striped active" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div class="progress-bar progress-bar-success" style="width:0%;"></div>
                </div>
            </td>
            <td>
                <button type="button" class="btn btn-primary start">
                    <i class="fa fa-upload"></i>
                    <span class="hidden-xs">上傳</span>
                </button>
                <button type="button" class="btn btn-warning cancel">
                    <i class="fa fa-ban"></i>
                    <span class="hidden-xs">取消</span>
                </button>
            </td>
        </tr>
    </script>

    {# 回傳回來的結果 #}
    <script id="video-result-template" type="text/x-custom-template">
        <tr class="template-download fade">
            <input name="videoId" type="hidden" />
            <td>
                <div class="preview text-center"></div>
                <strong class="title"></strong><br>
                <span class="desc"></span>
                <strong class="error text-danger"></strong>
            </td>
            <td>
                <div>
                    <small class="label label-warning canNotDeliver">
                        <i class="fa fa-bin"></i>不可外送
                    </small>
                </div>
                <button type="button" class="btn bg-purple setMainVideo" data-id="">
                    <i class="fa fa-check"></i>
                    <span class="hidden-xs">設為主影片</span>
                </button>
                <button type="button" class="btn btn-danger delete" data-id="">
                    <i class="fa fa-trash"></i>
                    <span class="hidden-xs">刪除</span>
                </button>
                <button type="button" class="btn btn-warning cancel hidden">
                    <i class="fa fa-ban"></i>
                    <span class="hidden-xs">取消</span>
                </button>
            </td>
        </tr>
    </script>

    {# 影片列表 #}
    <script id="template-video-block" type="text/x-custom-template">
        <div class="col-md-4 video-block">
            <input type="hidden" name="videoId"/>
            <div class="text-right">
                <button class="btn bg-purple btn-xs fa fa-check setMainVideo mainVideoEle"
                    type="button">設為主影片</button>
                <button class="btn btn-danger btn-xs fa fa-trash"
                    type="button"></button>
            </div>
            <div class="zoom text-center">
            </div>
            <div>
                <span class="desc hide"></span>
                <span class="title hide"></span>
                <button class="btn btn-success btn-xs fa fa-save" type="button"></button>
                <button class="btn btn-warning btn-xs fa fa-undo hidden" type="button"></button>
                <textarea name="title" rows="1" style="width: 100%"></textarea>
                <textarea name="desc" rows="3" style="width: 100%"></textarea>
            </div>
        </div>
    </script>

    {# 影片網址 #}
    <script src="/static/js/jquery.embedly-3.1.1.min.js"></script>
    <script type="text/javascript" src="/static/js/player-0.0.12.min.js"></script>
    <style>
        #files-video video, #url-video iframe {
            width: 400px;
            height: 280px;
        }
    </style>
    <script>
        $(function () {
            'use strict';

        /* 公用變數 */
            var uploadVideoUrl = '/video/upload';
            var createVideoUrl = '/video';
            var removeVideoUrl = '/video';
            var videoPreviewSize = { width: 400, height: 280 };
            var videoResultTemplate = $($('#video-result-template').html());
            var videoBlocks = $('.video-blocks');
            var videoStartElm = $('input[name=videoStartedAt]');
            var videoEndElm = $('input[name=videoEndedAt]');
            var videoStartElm = $('input[name=videoStartedAt]');
            var videoEndElm = $('input[name=videoEndedAt]');

            $.embedly.defaults.key = '3ee528c9eb4b4908b268ce1ace120c92';

        /* 初始化 + 公用函式*/
            initQueryFrom();
            function initQueryFrom() {
                var today = moment().format('YYYY-MM-DD');
                var prev2Month = moment().subtract(2, 'months').format('YYYY-MM-DD');
                videoStartElm.val(prev2Month);
                videoStartElm.attr('max', today);
                videoEndElm.val(today);
                videoEndElm.attr('max', today);
            }


            // 取得要被送出的資料
            var getFormData = function (targetEle) {
                var isDeliver = targetEle.find('input[name=isDeliver]:checked').length === 1;
                var desc = targetEle.find('textarea[name=desc]').val();
                var title = targetEle.find('input[name=title]').val();
                var url = targetEle.find('input[name=url]').val();

                return {
                    title: title,
                    desc: desc,
                    url: url,
                    type: 'NEWS',
                    isDeliver: isDeliver
                };
            };

            // 設定主按鈕
            var setMainVideo = function(setBtn) {
                var parentElm = setBtn.parent().parent();
                var previewHtml = '';
                var videoId = parentElm.find('input[name=videoId]').val();
                var title = parentElm.find('.title').text();
                var desc = parentElm.find('.desc').text();

                $('input[name=MainVideo]').val(videoId).trigger('change');

                var url = setBtn.attr('data-url');
                var previewHtml = videoUrlToPlayer().playerHtml(url, videoPreviewSize);
                previewHtml += '<br><strong class="title">' + title + '</strong><br><span>' + desc + '</span>';
                $('#video-preview').html(previewHtml);

            };

            // 產生不同來源的 Player
            var videoUrlToPlayer = function (){
                return {
                    fbV:function(url){
                        var exp = /^http(?:s?):\/\/(?:www\.|web\.|m\.)?facebook\.com\/([A-z0-9\.]+)\/videos(?:\/[0-9A-z].+)?\/(\d+)(?:.+)?$/;
                        return (url.match(exp)) ? RegExp.$2 : false;
                    },
                    ytV:function(url){
                        let exp = /^(?:https?:\/\/)?(?:www\.)?(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))((\w|-){11})(?:\S+)?$/;
                        return (url.match(exp)) ? RegExp.$1 : false;
                    },
                    playerHtml:function(url,setting){
                        setting = setting ? setting : {};
                        var width = setting.width || 300;
                        var height = setting.height || 150;

                        if(this.fbV(url)){
                            return '<iframe src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2Fsunnyhundalorg%2Fvideos%2F' + this.fbV(url) + '%2F&show_text=0" height="'+height+'" width="'+width+'" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowTransparency="true" allowFullScreen="true"></iframe>';
                        }
                        else if(this.ytV(url)){
                            return '<iframe src="https://www.youtube.com/embed/' + this.ytV(url) + '?ecver=2" height="'+height+'" width="'+width+'" frameborder="0" allowfullscreen></iframe>';
                        }
                        else{
                            return '<video class="video" width="'+width+'" height="'+height+'" controls> <source src="'+ url +'" type="video/mp4" > </video>'
                        }
                    }
                }
            }

            // 透過檔案資料，產生 Video Row Template
            var setVideoResultTemplate = function (videoResultTemplate, file) {

                videoResultTemplate.find('.delete').attr('data-id', file._id);
                videoResultTemplate.find('.setMainVideo').attr({
                    'data-id': file._id,
                    'data-url': file.url
                });
                videoResultTemplate.find('input[name=videoId]').val(file._id)
                videoResultTemplate.find('.title').text(file.title);
                videoResultTemplate.find('.desc').text(file.desc);
                videoResultTemplate.find('img').attr('data-isdeliver', file.isDeliver);

                if (file.isDeliver) {
                    videoResultTemplate.find('.canNotDeliver').remove();
                }

                var videoPlayer = videoUrlToPlayer().playerHtml(file.url);
                videoResultTemplate.find('.preview').html(videoPlayer);
                return videoResultTemplate;
            };

        /* -- 編輯頁面進來開始 -- */

            // 初始化 VideoPlayar
            if ($('input[name=MainVideoUrl]').length > 0){
                var url = $('input[name=MainVideoUrl]').val();
                $('#video-preview-player').html(videoUrlToPlayer().playerHtml(url, videoPreviewSize));
            }

            // 工具列：儲存、取消編輯
            $('.preview-toolbar').on('click', '.fa-save', function () {
                var parentBlock = $('#video-preview');
                var newTitle = parentBlock.find('input.new-title').val().trim();
                var originTitleElm = parentBlock.find('span.origin-title');
                var newDesc = parentBlock.find('textarea.new-desc').val().trim();
                var originDescElm = parentBlock.find('span.origin-desc');
                var undoBtn =  parentBlock.find('.btn.fa-undo');

                if (newTitle === originTitleElm.text() && newDesc === originDescElm.text() ) {
                    return alert('標題跟描述沒有更新！');
                }
                var videoId = $('input[name=MainVideo]').val();
                $.ajax({
                    url: '/video/' + videoId,
                    data: { title: newTitle, desc: newDesc },
                    method: 'PUT'
                }).done(function(result) {
                    originTitleElm.text(newTitle);
                    originDescElm.text(newDesc);
                    undoBtn.addClass('hidden');
                    alert('影片更新成功！');
                }).fail(function() {
                    alert('影片更新失敗！');
                });
            }).on('click', '.fa-undo', function () {
                var parentBlock = $('#video-preview');
                var newTitleElm = parentBlock.find('input.new-title');
                var originTitle = parentBlock.find('span.origin-title').text().trim();
                var newDescElm = parentBlock.find('textarea.new-desc');
                var originDesc = parentBlock.find('span.origin-desc').text().trim();

                newTitleElm.val(originTitle)
                newDescElm.val(originDesc);
                $(this).addClass('hidden');
            });

            // 偵測是否有編輯標題與描述
            $('#video-preview').on('change', 'textarea.new-desc, input.new-title', function() {
                var parentBlock = $('#video-preview');
                var originTitle = parentBlock.find('span.origin-title').text().trim();
                var originDesc = parentBlock.find('span.origin-desc').text().trim();
                var newTitle = parentBlock.find('input.new-title').val().trim();
                var newDesc = parentBlock.find('textarea.new-desc').val().trim();
                var undoBtn =  parentBlock.find('.btn.fa-undo');

                if (originTitle === newTitle && originDesc === newDesc ) {
                    undoBtn.addClass('hidden');
                    return;
                }
                undoBtn.removeClass('hidden');
            });
        /* -- 編輯頁面進來結束 -- */

        /* -- Tab: 影片上傳 開始 -- */
            $('#fileupload-video').fileupload({
                filesContainer: $('#files-video'),
                downloadTemplateId: null,
                paramName: 'video',
                url: uploadVideoUrl,
                uploadTemplateId: null,
                destroy: function (e, data) {
                    var that = this;
                    // 自己上傳的當下可以真刪除
                    $.ajax({
                        url: removeVideoUrl + '/' + data.id,
                        type: 'DELETE',
                        success: function(result) {
                            // 再去呼叫原生 library destroy 該做的事情
                            $.blueimp.fileupload.prototype.options.destroy.call(that, e, data);
                        }
                    });
                },
                downloadTemplate: function (o) {
                    var rows = $();
                    $.each(o.files, function (index, file) {
                        var row = $($('#video-result-template').html());
                        row = setVideoResultTemplate(row, file)

                        if (file.error) {
                            row.find('.setMainVideo').addClass('hidden');
                            row.find('.delete').addClass('hidden');
                            row.find('.cancel').removeClass('hidden');
                            row.find('.error').text(file.error);
                        }
                        rows = rows.add(row);
                    });
                    return rows;
                },
                getFilesFromResponse: function (data) {
                    return [data.result];
                },
                submit: function (e, data) {
                    var submitRow = $(data.context);
                    data.formData = getFormData(submitRow);
                },
                uploadTemplate: function (o) {
                    var rows = $();
                    $.each(o.files, function (index, file) {
                        var row = $($('#video-upload-template').html());
                        if (file.error) {
                            row.find('.start').addClass('hidden');
                            row.find('.error').text(file.error);
                        }
                        rows = rows.add(row);
                    });
                    return rows;
                }
            });

            $('#files-video').on('click', '.setMainVideo', function(){
                setMainVideo($(this));
            });
        /* -- Tab: 影片上傳 結束 -- */

        /* -- Tab: 影片網址 開始 -- */
            var $url = $('#video-url input[name=video-url]');
            var $urlResultElm = $('#url-video');
            // 預覽影片網址
            $('#video-url a.preview').on('click', function(){
                var url = $url.val();
                var $targetEle = $urlResultElm;
                $.embedly.oembed(url).progress(function(obj){
                    if (!obj.html){
                        $targetEle.html('');
                        window.alert('影片的連結有問題！');
                        return false;
                    }
                    var videoIframe = videoUrlToPlayer().playerHtml(obj.original_url);
                    var row = $($('#video-upload-template').html());
                    row.find('.preview').html(videoIframe);
                    row.find('input[name=title]').val(obj.title);
                    row.find('input[name=url]').val(obj.original_url);
                    row.find('textarea[name=desc]').val(obj.description);
                    row.find('.size').hide();
                    $targetEle.html(row).find('.fade').addClass('in');
                });

                return false;
            });

            // Tab: 影片網址：上傳後結果處理
            $urlResultElm.on('click', '.start', function(){
                var defaultTime = 10;
                var progressEle = $(this).parents('tr').find('.progress-bar');
                var formData = getFormData($urlResultElm);
                $(this).attr('disabled', 'disabled');
                $.post(createVideoUrl, formData)
                    .success(function(data){
                        progressEle.css('width', '100%');
                        window.clearInterval(timer);
                        var videoResultTemplate = $($('#video-result-template').html());
                        videoResultTemplate = setVideoResultTemplate(videoResultTemplate, data)
                        $urlResultElm.html(videoResultTemplate).find('.fade').addClass('in');
                    })
                    .fail(function(err){
                        console.error(err.responseJSON)
                    });

                // 設定進度條
                var timer = window.setInterval(function progressbarGo (){
                    defaultTime--;
                    var progress = 100 - defaultTime*10 + '%';
                    progressEle.css('width', progress)
                    if(defaultTime===0){
                        window.clearInterval(timer);
                        return false;
                    }
                }, 10);
            }).on('click', '.cancel', function(){
                return $urlResultElm.html('');
            }).on('click', '.delete', function(){
                var confirmed = confirm('您確定要刪除嗎？');
                if (!confirmed) { return; }

                var id = $(this).attr('data-id');
                $.ajax({
                    url: removeVideoUrl + '/' + id,
                    type: 'DELETE',
                    success: function(data) {
                        $urlResultElm.html('');
                    }
                });
            }).on('click', '.setMainVideo', function(){
                setMainVideo($(this))
            });
        /* -- Tab: 影片網址 結束 -- */

        /* -- Tab: 自家影片庫 開始 -- */

            var queryVideoLibrary = function (page) {
                var page = (typeof page === 'number') ? page : 1;
                videoBlocks.html('');
                var queryString = 'startedAt=' + videoStartElm.val();
                queryString += '&endedAt=' + videoEndElm.val();
                queryString += '&keywords=' + $('input[name=videoKeywords]').val();
                queryString += '&page=' + page;
                var desc = $('#video-library input[name=desc]').val();
                $.get('/video?' + queryString, function(result) {
                    $.each(result.videos, function(index, video) {
                        var block = $($('#template-video-block').html());
                        var videoPlayer = videoUrlToPlayer().playerHtml(video.url);
                        block.find('.text-center').html(videoPlayer);
                        block.find('input[name=videoId]').val(video._id);
                        block.find('span.desc').text(video.desc);
                        block.find('span.title').text(video.title);
                        block.find('textarea[name=title]').val(video.title);
                        block.find('textarea[name=desc]').val(video.desc);
                        block.find('.fa-check').attr('data-url', video.url);
                        videoBlocks.append(block);
                    });
                    // Process Pagination
                    var pageData = result.pageData;
                    $('#videoPageIndex').val(page);
                    $('.videoPage').html(page);
                    $('.totalPage').html(pageData.totalPage);
                    if (pageData.hasPrev) {
                        $('button.videoPrev').removeClass('hidden');
                    } else {
                        $('button.videoPrev').addClass('hidden');
                    }

                    if (pageData.hasNext) {
                        $('button.videoNext').removeClass('hidden');
                    } else {
                        $('button.videoNext').addClass('hidden');
                    }

                });
            }

            $('.videoLibQueryForm').on('click', queryVideoLibrary);
            $('button.videoPrev').on('click', function() {
                var page = parseInt($('#videoPageIndex').val(), 10);
                queryVideoLibrary(page - 1);
            });
            $('button.videoNext').on('click', function() {
                var page = parseInt($('#videoPageIndex').val(), 10);
                queryVideoLibrary(page + 1);
            });

            $('input#videoKeywords').on('keypress', function(e){
                if(e.keyCode === 13){
                    $('button.videoLibQueryForm').click();
                }
            });

            videoBlocks.on('click', 'button.setMainVideo', function() {
                setMainVideo($(this));
            });

            videoBlocks.on('click', 'button.fa-save', function() {
                var parentBlock = $(this).parent().parent();
                var videoIdInput = parentBlock.find('input[name=videoId]');
                var videoId = videoIdInput.val();
                var newDesc = parentBlock.find('textarea[name=desc]').val().trim();
                var originDescElm = parentBlock.find('span.desc');
                var newTitle = parentBlock.find('textarea[name=title]').val().trim();
                var originTitleElm = parentBlock.find('span.title');

                if (newDesc === originDescElm.text().trim() && newTitle === originTitleElm.text().trim() ) {
                    alert('沒有更新！');
                    return;
                }

                $.ajax({
                    url: '/video/'+videoId,
                    data: { desc: newDesc, title: newTitle },
                    method: 'PUT'
                }).done(function(result) {
                    originDescElm.text(newDesc);
                    originTitleElm.text(newTitle);
                    videoIdInput.val(result._id);
                    // undoBtn.addClass('hidden');
                    alert('update successfully');
                }).fail(function() {
                    alert('圖說更新失敗！');
                });

            });

            videoBlocks.on('click', 'button.fa-trash', function() {
                var confirmed = confirm('您確定要刪除嗎？');
                if (!confirmed) {
                    return;
                }
                var parentBlock = $(this).parent().parent();
                $.ajax({
                    url: '/video/' + parentBlock.find('input[name=videoId]').val(),
                    data: { video: {id : parentBlock.find('input[name=videoId]').val()} },
                    type: 'DELETE',
                }).done(function(result) {
                    parentBlock.remove();
                });
            });

            videoBlocks.on('change', 'textarea[name=desc],textarea[name=title]', function(e, c) {
                var parentBlock = $(this).parent();
                var newDesc = parentBlock.find('textarea[name=desc]').val().trim();
                var originDesc = parentBlock.find('span.desc').text().trim();
                var newTitle = parentBlock.find('textarea[name=title]').val().trim();
                var originTitle = parentBlock.find('span.title').text().trim();
                var undoBtn =  parentBlock.find('button.fa-undo');

                if (originDesc === newDesc && originTitle === newTitle) {
                    undoBtn.addClass('hidden');
                    return;
                }
                undoBtn.removeClass('hidden');
            });

            videoBlocks.on('click', 'button.fa-undo', function() {
                var parentBlock = $(this).parent();

                var newDescEle = parentBlock.find('textarea[name=desc]')
                var newDesc = newDescEle.val().trim();
                var originDesc = parentBlock.find('span.desc').text().trim();

                var newTitleEle = parentBlock.find('textarea[name=title]');
                var newTitle = newTitleEle.val().trim();
                var originTitle = parentBlock.find('span.title').text().trim();

                newDescEle.val(originDesc);
                newTitleEle.val(originTitle);

                $(this).addClass('hidden');
            });

            $('button.videoCollapse').on('click', function() {
                $('.video-setting-area .video-btn-collapse').click();
            });
        /* -- Tab: 自家影片庫 結束 -- */

        });


    </script>
</div>
