 <div class="box publish-setting">
    <div class="box-header with-border">
        <h3 class="box-title">
            影片設定上傳區
            <span class="text-danger">*</span>
        </h3>
        <div class="box-tools pull-right">
            <button type="button" class="btn btn-box-tool" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                <i class="fa fa-minus"></i>
            </button>
        </div>
    </div>
    <div class="box-body">
        <div class="row">
            <div class="col-sm-12">
                <div class="content">
                    <ul class="nav nav-tabs ui-sortable-handle">
                        <li class="active"><a href="#video-url" data-toggle="tab">影片網址</a></li>
                        <li class=""><a href="#video-upload" data-toggle="tab">影片上傳</a></li>
                    </ul>
                    <div class="tab-content no-padding">
                        <div class="tab-pane active" id="video-url">
                            <div class="url-form">
                                <br>
                                <label for="MainVideo">影片 URL</label>
                                <div class="input-group">
                                    <input id="MainVideo" name="MainVideo" type="text" value="http://vimeo.com/18150336" class="form-control">
                                    <div class="input-group-btn">
                                        <a class="btn btn-info">預覽影片</a>
                                    </div>
                                </div>
                            </div>
                            <br>
                            <div id="result" class="img-responsive text-center"></div>
                        </div>
                        <div class="tab-pane active" id="video-upload">
                            <br>
                            <!-- The fileinput-button span is used to style the file input field as button -->
                            <span class="btn btn-success fileinput-button">
                                <i class="glyphicon glyphicon-plus"></i>
                                <span>Add files...</span>
                                <!-- The file input field used as target for the file upload widget -->
                                <input id="fileupload-video" type="file" name="files[]" multiple>
                            </span>
                            <br>
                            <!-- The global progress bar -->
                            <div id="progress-video" class="progress">
                                <div class="progress-bar progress-bar-success"></div>
                            </div>
                            <!-- The container for the uploaded files -->
                            <div id="files-video" class="files"></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
    {# 影片上傳 #}
    <!-- CSS to style the file input field as button and adjust the Bootstrap progress bars -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/blueimp-file-upload/9.17.0/css/jquery.fileupload.min.css">
    <!-- The jQuery UI widget factory, can be omitted if jQuery UI is already included -->
    <!-- The Load Image plugin is included for the preview images and image resizing functionality -->
    <!-- The basic File Upload plugin -->
    <!-- The File Upload processing plugin -->

    <!-- The File Upload video preview plugin -->
    <!--<script src="/static/js/file-upload/jquery.fileupload-video.js"></script>-->
    <!-- The File Upload validation plugin -->
    <!--<script src="js/jquery.fileupload-validate.js"></script>-->


    {# 影片網址 #}
    <script src="http://cdn.embed.ly/jquery.embedly-3.1.1.min.js"></script>
    <script type="text/javascript" src="//cdn.embed.ly/player-0.0.12.min.js"></script>
    <style>
        #result > iframe {
            width: 100%;
        }
    </style>
    <script>
        /*jslint unparam: true, regexp: true */
        /*global window, $ */
        $(function () {
            'use strict';
            // Change this to the location of your server-side upload handler:
            var url = '/video/',
                uploadButton = $('<button/>')
                    .addClass('btn btn-primary')
                    .prop('disabled', true)
                    .text('Processing...')
                    .on('click', function () {
                        var $this = $(this),
                            data = $this.data();
                        $this
                            .off('click')
                            .text('Abort')
                            .on('click', function () {
                                $this.remove();
                                data.abort();
                            });
                        data.submit().always(function () {
                            $this.remove();
                        });
                    });
            console.log(123);
            $('#fileupload-video').fileupload({
                url: url,
                dataType: 'json',
                autoUpload: false,
                acceptFileTypes: /(\.|\/)(gif|jpe?g|png)$/i,
                maxFileSize: 999000,
                // Enable image resizing, except for Android and Opera,
                // which actually support image resizing, but fail to
                // send Blob objects via XHR requests:
                disableImageResize: /Android(?!.*Chrome)|Opera/
                    .test(window.navigator.userAgent),
                previewMaxWidth: 100,
                previewMaxHeight: 100,
                previewCrop: true
            }).on('fileuploadadd', function (e, data) {
                console.log(123)
                data.context = $('<div/>').appendTo('#files-video');
                $.each(data.files, function (index, file) {
                    var node = $('<p/>')
                            .append($('<span/>').text(file.name));
                    if (!index) {
                        node
                            .append('<br>')
                            .append(uploadButton.clone(true).data(data));
                    }
                    node.appendTo(data.context);
                });
            }).on('fileuploadprocessalways', function (e, data) {
                console.log(999)
                var index = data.index,
                    file = data.files[index],
                    node = $(data.context.children()[index]);
                if (file.preview) {
                    node
                        .prepend('<br>')
                        .prepend(file.preview);
                }
                if (file.error) {
                    node
                        .append('<br>')
                        .append($('<span class="text-danger"/>').text(file.error));
                }
                if (index + 1 === data.files.length) {
                    data.context.find('button')
                        .text('Upload')
                        .prop('disabled', !!data.files.error);
                }
            }).on('fileuploadprogressall', function (e, data) {
                var progress = parseInt(data.loaded / data.total * 100, 10);
                $('#progress-video .progress-bar').css(
                    'width',
                    progress + '%'
                );
            }).on('fileuploaddone', function (e, data) {
                $.each(data.result.files, function (index, file) {
                    if (file.url) {
                        var link = $('<a>')
                            .attr('target', '_blank')
                            .prop('href', file.url);
                        $(data.context.children()[index])
                            .wrap(link);
                    } else if (file.error) {
                        var error = $('<span class="text-danger"/>').text(file.error);
                        $(data.context.children()[index])
                            .append('<br>')
                            .append(error);
                    }
                });
            }).on('fileuploadfail', function (e, data) {
                $.each(data.files, function (index) {
                    var error = $('<span class="text-danger"/>').text('File upload failed.');
                    $(data.context.children()[index])
                        .append('<br>')
                        .append(error);
                });
            }).prop('disabled', !$.support.fileInput)
                .parent().addClass($.support.fileInput ? undefined : 'disabled');
        });

        $(function(){

            // 一般影片連結
            var player = null;
            var embed = function(url){

                return $.embedly.oembed(url, {query: {scheme: 'http', maxwidth: '600'}})
                .progress(function(obj){

                    if (!obj.html){
                        $('#result').html('');
                        window.alert('影片的連結有問題！');
                        return false;
                    }

                    $('#result').html(obj.html);
                });
            };

            // URL inpute
            var $url = $('#MainVideo');
            $('.url-form a').on('click', function(){
                embed($url.val());
                return false;
            });

        });
        $.embedly.defaults.key = '3ee528c9eb4b4908b268ce1ace120c92';
    </script>
</div>
