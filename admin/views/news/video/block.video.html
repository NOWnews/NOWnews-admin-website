 <div class="box publish-setting">
    <div class="box-header with-border">
        <h3 class="box-title">
            影片設定上傳區
            <span class="text-danger">*</span>
        </h3>
        <div class="box-tools pull-right">
            <button type="button" class="btn btn-box-tool" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                <i class="fa fa-minus"></i>
            </button>
        </div>
    </div>
    <div class="box-body">
        <div class="row">
            <div class="col-sm-12">
                <div class="content">
                    <ul class="nav nav-tabs ui-sortable-handle">
                        <li class="active"><a href="#video-url" data-toggle="tab">影片網址</a></li>
                        <li class=""><a href="#video-upload" data-toggle="tab">影片上傳</a></li>
                    </ul>
                    <div class="tab-content no-padding">
                        <div class="tab-pane active" id="video-url">
                            <div class="url-form">
                                <br>
                                <label for="MainVideo">影片 URL</label>
                                <div class="input-group">
                                    <input id="MainVideo" name="MainVideo" type="text" value="http://vimeo.com/18150336" class="form-control">
                                    <div class="input-group-btn">
                                        <a class="btn btn-info">預覽影片</a>
                                    </div>
                                </div>
                            </div>
                            <br>
                            <div id="result" class="img-responsive text-center"></div>
                        </div>
                        <div class="tab-pane active" id="video-upload">
                            <br>
                            <!-- The fileinput-button span is used to style the file input field as button -->
                            <span class="btn btn-success fileinput-button">
                                <i class="glyphicon glyphicon-plus"></i>
                                <span>上傳影片檔</span>
                                <!-- The file input field used as target for the file upload widget -->
                                <input id="fileupload-video" type="file" name="files[]" multiple>
                            </span>
                            <br>
                            <br>
                            <!-- The global progress bar -->
                            <div id="progress-video" class="progress">
                                <div class="progress-bar progress-bar-success"></div>
                            </div>
                            <!-- The container for the uploaded files -->
                            <table role="presentation" class="table table-striped">
                                <tbody id="files-video"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {# 模板 #}
    <script id="video-result-template" type="text/x-custom-template">
        <tr class="template-download fade">
            <td>
                <div class="preview">
                    <video width="400" controls>
                        <source src="" type="">
                    </video>
                </div>
                <span class="desc"></span>
                <strong class="error text-danger"></strong>
            </td>
            <td>
                <div style="{position: relative;}">
                    <small class="label label-warning canNotDeliver">
                        <i class="fa fa-bin"></i>不可外送
                    </small>
                </div>
                <button type="button" class="btn bg-purple setMainVideo" data-id="">
                    <i class="fa fa-check"></i>
                    <span class="hidden-xs">設為主影片</span>
                </button>
                <button type="button" class="btn btn-danger delete" data-id="">
                    <i class="fa fa-trash"></i>
                    <span class="hidden-xs">刪除</span>
                </button>
                <button type="button" class="btn btn-warning cancel hidden">
                    <i class="fa fa-ban"></i>
                    <span class="hidden-xs">取消</span>
                </button>
            </td>
        </tr>
    </script>

    {# 影片上傳 #}
    <!-- CSS to style the file input field as button and adjust the Bootstrap progress bars -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/blueimp-file-upload/9.17.0/css/jquery.fileupload.min.css">

    {# 影片網址 #}
    <script src="http://cdn.embed.ly/jquery.embedly-3.1.1.min.js"></script>
    <script type="text/javascript" src="//cdn.embed.ly/player-0.0.12.min.js"></script>
    <style>
        #result iframe {
            width: 100%;
        }
    </style>
    <script>
        /*jslint unparam: true, regexp: true */
        /*global window, $ */
        $(function () {
            'use strict';

            /* 公用變數 */
            var URL = window.URL || window.webkitURL;
            var uploadVideoUrl = '/video/upload';
            var createVideoUrl = '/video';
            var removeVideoUrl = '/video/realRemove/';

            /* 上傳 */
            // Initialize the jQuery File Upload widget:
            $('#fileupload-video').fileupload({
                filesContainer: $('#files-video'),
                downloadTemplateId: null,
                paramName: 'video',
                url: uploadVideoUrl,
                uploadTemplateId: null,
                destroy: function (e, data) {
                    var that = this;
                    // 自己上傳的當下可以真刪除
                    $.ajax({
                        url: removeVideoUrl + data.id,
                        type: 'DELETE',
                        success: function(result) {
                            // 再去呼叫原生 library destroy 該做的事情
                            $.blueimp.fileupload.prototype.options.destroy.call(that, e, data);
                        }
                    });
                },
                downloadTemplate: function (o) {
                    console.log('downloadTemplate', o)
                    var rows = $();
                    $.each(o.files, function (index, file) {
                        console.log(file, "L147")
                        var row = $($('#video-result-template').html());
                        row.find('.delete').attr('data-id', file._id);
                        row.find('.setMainVideo').attr('data-id', file._id);
                        row.find('.setMainVideo').attr('data-url', file.url);
                        row.find('.desc').text(file.desc);
                        row.find('source').attr({
                            'src': file.url,
                            'type': file.mimetype
                        });


                        row.find('img').attr('data-isdeliver', file.isDeliver);
                        if (file.isDeliver) {
                            row.find('.canNotDeliver').remove();
                        }

                        if (file.error) {
                            row.find('.setMainVideo').addClass('hidden');
                            row.find('.delete').addClass('hidden');
                            row.find('.cancel').removeClass('hidden');
                            row.find('.error').text(file.error);
                        }
                        rows = rows.add(row);
                    });
                    return rows;
                },
                getFilesFromResponse: function (data) {
                    console.log('getFilesFromResponse')
                    return [data.result];
                },
                submit: function (e, data) {
                    console.log('submit')
                    var nextRow = $(data.context).next();
                    var submitRow = $(data.context);
                    var isDeliver = submitRow.find('input[name=isDeliver]:checked').length === 1;
                    var desc = submitRow.find('textarea[name=desc]').val();

                    data.formData = {
                        title: desc,
                        desc: desc,
                        type: 'NEWS',
                        isDeliver: isDeliver,
                    };

                    if (nextRow.attr('id') === 'crop-row') {
                        nextRow.remove();
                    }
                },
                uploadTemplate: function (o) {
                    console.log('uploadTemplate')
                    var rows = $();
                    $.each(o.files, function (index, file) {
                        var blobURL = URL.createObjectURL(file);
                        var row = $($('#template-upload').html());
                        row.find('button.crop').attr('data-blobURL', blobURL);
                        if (file.error) {
                            row.find('.crop').addClass('hidden');
                            row.find('.start').addClass('hidden');
                            row.find('.error').text(file.error);
                        }
                        rows = rows.add(row);
                    });
                    return rows;
                },

            });
        });

        $(function(){

            // 一般影片連結
            var player = null;
            var embed = function(url){

                return $.embedly.oembed(url, {query: {scheme: 'http', maxwidth: '600'}})
                .progress(function(obj){

                    if (!obj.html){
                        $('#result').html('');
                        window.alert('影片的連結有問題！');
                        return false;
                    }

                    $('#result').html(obj.html);
                });
            };

            // URL inpute
            var $url = $('#MainVideo');
            $('.url-form a').on('click', function(){
                embed($url.val());
                return false;
            });

        });
        $.embedly.defaults.key = '3ee528c9eb4b4908b268ce1ace120c92';
    </script>
</div>
