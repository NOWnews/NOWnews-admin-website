<table id="statistics-table" class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>使用者名稱</th>
            <th>新聞總數</th>
            <th>PageView總數</th>
        </tr>
    </thead>
    <tbody>
        {% for value in center.users %}
            <tr>
                <td>
                    <a href="/statistics/users/{{ value.userId }}" target="_blank">
                    {{ value.name}}
                    </a>
                </td>
                <td>
                    {{ value.newsTotal }}
                </td>
                <td>{{ value.pvTotal }}</td>
            </tr>
        {% endfor %}
    </tbody>
    <tfoot>
        <tr>
            <th>使用者名稱</th>
            <th>新聞總數</th>
            <th>PageView總數</th>
        </tr>
    </tfoot>
</table>
