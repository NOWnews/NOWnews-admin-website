{% set title = "圖片列表" %}
{% extends "../base.html" %}

{% block headTitle %}
    <title>大編輯台 | {{ title }}</title>
{% endblock %}

{% block container %}
<section class="content">
    <div>
        <div class="box image-setting-area">
            <div class="box-header with-border">
                <h3 class="box-title">圖片列表</h3>
                <div class="box-tools pull-right">
                    <button type="button" class="btn btn-box-tool btn-collapse" data-widget="collapse" data-toggle="tooltip" title="Collapse">
                        <i class="fa fa-minus"></i>
                    </button>
                </div>
            </div>
            <div class="box-body">
                {% include '../util/fileuploadList.html' %}
                </div>
            </div>
        </div>
    </div>
</section>
<style>
    .setMainPhoto.mainPhotoEle, .fa-clipboard.btn {
        display: none;
    }
</style>
<script>
    $(document).ready(function() {
        $('.imageLibQueryForm').click();
        $('input#imgKeywords').on('keypress',function(e){
          if(e.keyCode === 13){
            $('button.imageLibQueryForm').click();
          }
        });
    });
</script>
{% endblock %}
