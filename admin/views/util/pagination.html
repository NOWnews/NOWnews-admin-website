<div class="dataTables_paginate">
    {% if pageData.hasPrev %}
        <a class="paginate_button previous" href="?page={{ pageData.prevPage }}">
            上一頁
        </a>
    {% else %}
        <a class="paginate_button next disabled">上一頁</a>
    {% endif %}

    <span>
        <a class="paginate_button current">
            {{ pageData.currentPage }}
        </a>
    </span>

    {% if pageData.hasNext %}
        <a class="paginate_button next" href="?page={{ pageData.nextPage }}">
            下一頁
        </a>
    {% else %}
        <a class="paginate_button next disabled">下一頁</a>
    {% endif %}
</div>
