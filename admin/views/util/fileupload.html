<div class="content">
    <!-- Nav tabs -->
    <ul class="nav nav-tabs" role="tablist">
        <li role="presentation" class="active">
            <a href="#home" aria-controls="home" role="tab" data-toggle="tab">上傳</a>
        </li>
        <li role="presentation">
            <a href="#library" aria-controls="library" role="tab" data-toggle="tab">圖庫</a>
        </li>
    </ul>
    <br />
    <!-- Tab panes -->
    <div class="tab-content">
        <div role="tabpanel" class="tab-pane active" id="home">

            <!-- Hidden -->
            <input id="userId" type="hidden" value="{{ currentUser._id }}" />
            <iframe id="clipboard-source" class="hidden"></iframe>

            <div class="row fileupload-buttonbar">
                <div class="col-md-7">
                    <label class="btn btn-success fileinput-button" for="image-file">
                        <i class="fa fa-plus"></i>
                        <span>新增檔案</span>
                        <input id="image-file" type="file" name="files[]" multiple class="sr-only">
                    </label>
                    <button type="button" class="btn btn-primary start">
                        <i class="fa fa-upload"></i>
                        <span>全部上傳</span>
                    </button>
                    <button type="button" class="btn bg-navy copy">
                        <i class="fa fa-copy"></i>
                        <span>複製（供內文用）</span>
                    </button>
                    <!-- The global file processing state -->
                    <span class="fileupload-process"></span>
                </div>
                <!-- The global progress state -->
                <div class="col-md-5 fileupload-progress fade">
                    <!-- The global progress bar -->
                    <div class="progress progress-striped active" role="progressbar" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar progress-bar-success" style="width:0%;"></div>
                    </div>
                    <!-- The extended global progress state -->
                    <div class="progress-extended">&nbsp;</div>
                </div>
            </div>
            <!-- The table listing the files available for upload/download -->
            <table role="presentation" class="table table-striped">
                <tbody class="files"></tbody>
            </table>
        </div>
        <div role="tabpanel" class="tab-pane" id="library">
            <div class="row">
                <div class="form-group col-md-2">
                    <input name="imgStartedAt" type="date" />
                </div>
                <div class="form-group col-md-2">
                    <input name="imgEndedAt" type="date" />
                </div>
                <div class="form-group col-md-2">
                    <input name="desc" type="text" placeholder="關鍵字" />
                </div>
                <div class="form-group col-md-1">
                    <button type="button" class="btn btn-default imageLibQueryForm">查詢</button>
                </div>
                <div class="form-group col-md-2">
                    <button type="button" class="btn bg-navy copy">
                        <i class="fa fa-copy"></i>
                        <span>複製（供內文用）</span>
                    </button>
                </div>


            </div>
            <div class="row image-blocks">

            </div>
        </div>
    </div>
</div>

<script id="template-crop" type="text/x-custom-template">
    <tr id="crop-row">
        <td colspan="3">
            <div>
                <img width="200" id="crop-img"/>
            </div>
            <div class="text-center">
                <button type="button" class="confirm btn btn-primary" data-blobURL>
                    <i class="fa fa-crop"></i>
                    <span>確認裁切</span>
                </button>
            </div>
        </td>
    </tr>
</script>

<script id="template-upload" type="text/x-custom-template">
    <tr class="template-upload fade">
        <td>
            <span class="preview">
                <img class="upload-img hidden" width="80" height="40"/>
            </span>
            <p>
                <input name="desc" style="width: 100%" type="text" placeholder="圖說" />
            </p>
            <strong class="error text-danger"></strong>
        </td>
        <td class="hidden-xs">
            <p class="size">處理中...</p>
            <div class="progress progress-striped active" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="progress-bar progress-bar-success" style="width:0%;"></div>
            </div>
        </td>
        <td>
            <button type="button" class="crop btn btn-default" data-blobURL=>
                <i class="fa fa-crop"></i>
                <span class="hidden-xs">裁切</span>
            </button>
            <button type="button" class="btn btn-primary start">
                <i class="fa fa-upload"></i>
                <span class="hidden-xs">上傳</span>
            </button>
            <button type="button" class="btn btn-warning cancel">
                <i class="fa fa-ban"></i>
                <span class="hidden-xs">取消</span>
            </button>
        </td>
    </tr>
</script>

<script id="template-download" type="text/x-custom-template">
    <tr class="template-download fade">
        <td>
            <input type="checkbox" name="downloadForClipboard" />
        </td>
        <td>
            <div class="preview zoom">
                <img class="image"/>
            </div>
            <p class="desc"></p>
            <strong class="error text-danger"></strong>
        </td>
        <td>
            <button type="button" class="btn bg-purple setMainPhoto" data-id="">
                <i class="fa fa-check"></i>
                <span class="hidden-xs">設為主圖</span>
            </button>
            <button type="button" class="btn btn-danger delete" data-id="">
                <i class="fa fa-trash"></i>
                <span class="hidden-xs">刪除</span>
            </button>
            <button type="button" class="btn btn-warning cancel hidden">
                <i class="fa fa-ban"></i>
                <span class="hidden-xs">取消</span>
            </button>
        </td>
    </tr>
</script>

<script id="template-image-block" type="text/x-custom-template">
    <div class="col-md-3 image-block">
        <div class="text-right">
            <button class="btn bg-purple btn-xs fa fa-check"
                type="button">設為主圖</button>
            <button class="btn btn-danger btn-xs fa fa-trash"
                type="button"></button>
        </div>
        <div class="zoom text-center">
            <img class="image" />
        </div>
        <label>
            <input type="checkbox" name="libForClipboard" />
            <span class="desc"></span>
        </label>
    </div>
</script>

<!-- moment -->
<script src="//cdnjs.cloudflare.com/ajax/libs/bootstrap-daterangepicker/2.1.24/moment.min.js "></script>

<!-- The jQuery UI widget factory, can be omitted if jQuery UI is already included -->
<script src="//cdnjs.cloudflare.com/ajax/libs/jqueryui/1.9.2/jquery.ui.widget.min.js "></script>

<!-- The Load Image plugin is included for the preview images and image resizing functionality -->
<script src="//blueimp.github.io/JavaScript-Load-Image/js/load-image.all.min.js "></script>

<!-- The basic File Upload plugin -->
<script src="//cdnjs.cloudflare.com/ajax/libs/blueimp-file-upload/9.5.2/jquery.fileupload.min.js"></script>

<!-- The File Upload processing plugin -->
<script src="//cdnjs.cloudflare.com/ajax/libs/blueimp-file-upload/9.5.2/jquery.fileupload-process.js "></script>

<!-- The File Upload image preview & resize plugin -->
<script src="//cdnjs.cloudflare.com/ajax/libs/blueimp-file-upload/9.5.2/jquery.fileupload-image.js "></script>

<!-- The File Upload user interface plugin -->
<script src="//cdnjs.cloudflare.com/ajax/libs/blueimp-file-upload/9.5.2/jquery.fileupload-ui.js "></script>

<!-- The File Zoom -->
<script src="http://www.jacklmoore.com/js/jquery.zoom.js "></script>

<!-- The main application script -->
<script src="/static/js/fileupload.js "></script>

    .zoom, .image-preview {
        min-width: 160px;
        max-width: 320px;
        max-height: 180px;
    }

    .image  {
        height: auto;
        max-height: 180px;
        max-width: 100%;
    }

    .image-block {
        background: #d2d6de;
        border: 1px solid #fff;
        height: 250px;
        margin-bottom: 5px;
    }

    .image-block .text-right {
        padding-bottom: 3px;
    }

</style>
